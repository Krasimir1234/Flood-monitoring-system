<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script>
        L_NO_TOUCH = false;
        L_DISABLE_3D = false;
    </script>
    <style>html, body {width: 100%;height: 100%;margin: 0;padding: 0;}</style>
    <style>#map {position:absolute;top:0;bottom:0;right:0;left:0;}</style>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap-glyphicons.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/python-visualization/folium/folium/templates/leaflet.awesome.rotate.min.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        #map_4dd70a0199837d8d02d335dad5f030b9 {
            position: relative;
            width: 100.0%;
            height: 100.0%;
            left: 0.0%;
            top: 0.0%;
        }
        .leaflet-container { font-size: 1rem; }
    </style>
    <nav class="navbar navbar-expand-lg" style="background-color: #343a40;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" style="color: #ffffff; font-size: 1.5rem;">Flood Reporter</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="color: #ffffff;"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-bold" href="/profile">Profile</a>
                    </li>
                    <li class="nav-item">
                        <button type="button" id="reportButton" class="btn btn-warning ms-3" data-bs-toggle="modal" data-bs-target="#reportModal">
                            Report
                        </button>
                    </li>
                    <li class="nav-item">
                        <button id="logoutButton" class="btn btn-danger ms-3">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</head>
<body>
    <div class="folium-map" id="map_4dd70a0199837d8d02d335dad5f030b9"></div>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #495057; color: #f8f9fa;">
                    <h5 class="modal-title" id="reportModalLabel">Report Flood</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="reportForm">
                        <div class="mb-3">
                            <label for="addressInput" class="form-label fw-bold" style="color: #495057;">Address in Austria</label>
                            <input type="text" class="form-control" id="addressInput" placeholder="Enter an address" required>
                        </div>
                        <div class="mb-3">
                            <label for="descriptionInput" class="form-label fw-bold" style="color: #495057;">Description</label>
                            <textarea class="form-control" id="descriptionInput" rows="4" placeholder="Enter description"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #6c757d; border: none;">Submit Report</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        var map_4dd70a0199837d8d02d335dad5f030b9 = L.map("map_4dd70a0199837d8d02d335dad5f030b9", {
            center: [47.5162, 14.5501],
            crs: L.CRS.EPSG3857,
            zoom: 7,
            zoomControl: true,
            preferCanvas: false,
        });

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map_4dd70a0199837d8d02d335dad5f030b9);

        // Load GeoJSON for Austria boundaries
        fetch("/static/geojson/map.geojson")
            .then(response => response.json())
            .then(data => {
                const polygonCoordinates = data.features.flatMap(feature => feature.geometry.coordinates);

                const austriaPolygon = {
                    "type": "Feature",
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [polygonCoordinates]
                    }
                };

                L.geoJSON(austriaPolygon, {
                    style: {
                        color: "blue",  // Border color
                        weight: 2,      // Border thickness
                        fillOpacity: 0  // No fill for Austria
                    }
                }).addTo(map_4dd70a0199837d8d02d335dad5f030b9);

                const worldMask = {
                    "type": "FeatureCollection",
                    "features": [
                        {
                            "type": "Feature",
                            "geometry": {
                                "type": "Polygon",
                                "coordinates": [
                                    [[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]]
                                ].concat([polygonCoordinates])
                            }
                        }
                    ]
                };

                L.geoJSON(worldMask, {
                    style: {
                        color: "grey",
                        weight: 1,
                        fillOpacity: 0.7,
                        fillColor: "grey"
                    }
                }).addTo(map_4dd70a0199837d8d02d335dad5f030b9);
            })
            .catch(error => console.error("Error loading GeoJSON:", error));

        // Handle Logout
        document.getElementById('logoutButton').addEventListener('click', async function () {
            try {
                const response = await fetch('/logout', { method: 'POST' });
                if (response.ok) {
                    alert('Logged out successfully');
                } else {
                    console.warn('Logout request failed. Redirecting to login anyway.');
                }
            } catch (error) {
                console.error('Error during logout:', error);
                alert('An error occurred while logging out.');
            } finally {
                window.location.href = '/login';
            }
        });

        // Handle Report Submission
        document.getElementById('reportForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const address = document.getElementById('addressInput').value;
            const description = document.getElementById('descriptionInput').value;

            try {
                const geocodeResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}, Austria`);
                const geocodeData = await geocodeResponse.json();

                if (geocodeData.length > 0) {
                    const { lat, lon } = geocodeData[0];

                    const marker = L.marker([lat, lon]).addTo(map_4dd70a0199837d8d02d335dad5f030b9);
                    marker.bindPopup(`<strong>${address}</strong><br>${description}`).openPopup();

                    const reportResponse = await fetch('/report', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address, description, lat, lon }),
                    });

                    if (!reportResponse.ok) {
                        throw new Error('Failed to save the report.');
                    }

                    alert('Report submitted successfully!');
                    document.getElementById('reportForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
                } else {
                    alert('Unable to find location. Please enter a valid address.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while submitting the report.');
            }
        });

        // Handle Profile Redirect
        const profileButton = document.querySelector('.nav-link[href="profile.html"]');
        if (profileButton) {
            profileButton.addEventListener('click', function (e) {
                e.preventDefault(); // Prevent default link behavior
                console.log('Redirecting to profile.html');
                window.location.href = 'profile.html'; // Redirect to the profile page
            });
        } else {
            console.error("Profile button not found.");
        }
    });
    </script>
</body>
</html>
