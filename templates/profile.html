<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced User Profile</title>
    <link rel="stylesheet" href="static/css/profile.css">
</head>
<body>
    <div class="profile-container">
        <h1 style="color: #0277bd;">User Profile</h1>
        <div class="profile-info">
            <label>Name:</label>
            <span id="nameDisplay"></span>
            <input type="text" id="nameInput" style="display:none;">

            <label>Email:</label>
            <span id="emailDisplay"></span>
            <input type="email" id="emailInput" style="display:none;">

            <label>Username:</label>
            <span id="usernameDisplay"></span>
            <input type="text" id="usernameInput" style="display:none;">
        </div>
        <div class="button-container">
            <button id="editBtn" onclick="editProfile()">Edit Profile</button>
            <button id="saveBtn" style="display:none;" onclick="saveProfile()">Save</button>
            <button onclick="location.href='/map'">View Map</button>
            <button id="logoutButton">Logout</button>
        </div>
    </div>

    <script src="static/js/profile.js"></script>
</body>
</html>
